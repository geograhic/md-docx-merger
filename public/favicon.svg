<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Markdown 批量转 Word / 合并">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="mark" x1="150" y1="200" x2="360" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b3a8f" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- rounded tile background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- back page (merge hint) -->
  <rect x="150" y="132" width="212" height="270" rx="26" fill="#ffffff" opacity="0.38" transform="rotate(-8 256 267)"/>

  <!-- front document -->
  <g filter="url(#sh)">
    <path d="M150 150
             a26 26 0 0 1 26 -26
             h120 l66 66
             v206
             a26 26 0 0 1 -26 26
             h-160
             a26 26 0 0 1 -26 -26
             z" fill="#ffffff"/>
    <!-- folded corner -->
    <path d="M296 124 l66 66 h-46 a20 20 0 0 1 -20 -20 z" fill="#dbeafe"/>
  </g>

  <!-- Markdown "M v" mark -->
  <g fill="url(#mark)">
    <!-- M strokes -->
    <path d="M182 250 h26 l24 32 24 -32 h26 v96 h-26 v-56 l-24 30 -24 -30 v56 h-26 z"/>
    <!-- down chevron / arrow head -->
    <path d="M320 250 h26 v46 h22 l-35 42 -35 -42 h22 z"/>
  </g>
</svg>
